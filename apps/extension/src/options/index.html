<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hyday-capture 設定</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
        font-size: 14px;
        line-height: 1.6;
        color: #1a1a1a;
      }
      h1 {
        font-size: 20px;
      }
      .card {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 16px 20px;
        margin-top: 16px;
      }
      button {
        font-size: 14px;
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
      }
      button.primary {
        background: #1a73e8;
        color: #fff;
        border-color: #1a73e8;
      }
      #current {
        margin-top: 12px;
      }
      code {
        background: #f0f0f0;
        padding: 1px 5px;
        border-radius: 3px;
      }
      .muted {
        color: #666;
      }
      .ok {
        color: #147a3d;
      }
      .err {
        color: #b3261e;
      }
      .hint {
        font-size: 13px;
        color: #666;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>hyday-capture 設定</h1>
    <div class="card">
      <strong>輸出資料夾</strong>
      <p class="muted">
        選一個資料夾，擷取的筆記會寫進這裡，通常就是你的 hyday vault。之後每次擷取都會自動寫入，
        瀏覽器詢問權限時請選每次都允許。
      </p>
      <button id="pick" class="primary">選擇輸出資料夾</button>
      <div id="current" class="muted">尚未選擇資料夾</div>
      <p class="hint">
        提示：筆記不會寫進 <code>.hyday</code>、<code>templates</code>、<code>assets</code>，
        也不會用日期當檔名，避免被 hyday 誤認成 journal。
      </p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
